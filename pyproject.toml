[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tagger2-inference-rebuild"
version = "1.5.0"
description = "Local and online image tagging workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "numpy>=1.24,<3",
  "huggingface_hub>=0.24,<2",
  "safetensors>=0.4,<1",
  "transformers>=4.47,<6",
  "keyring>=25,<26",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "onnxruntime-gpu>=1.18,<2",
  "timm>=1.0,<2",
]
cpu = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "onnxruntime>=1.18,<2",
  "timm>=1.0,<2",
]
adapters = ["peft>=0.13,<1", "lycoris-lora>=3,<4"]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["models", "data_cache", "frontend/node_modules"]

[tool.ruff.lint]
# Keep the repository gate deterministic across the locked Ruff line.  The
# verbatim source ports retain their original imports so the byte-level port
# guard remains meaningful; only their known unused compatibility imports are
# ignored.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"backend/tagger2/workflow/caption_format/normalizer.py" = ["F401"]
"backend/tagger2/workflow/raw_e621.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(^|[\\/])(models|data_cache|frontend[\\/]node_modules|backend[\\/]tests)([\\/]|$)"

# These four modules are byte-for-byte ports guarded by
# backend/tests/test_workflow_ports.py.  Keep the source text untouched and
# scope only mypy's inference-only diagnostics to the immutable ports.
[[tool.mypy.overrides]]
module = [
  "tagger2.workflow.caption_format.normalizer",
  "tagger2.workflow.stages.policy",
  "tagger2.workflow.stages.replacement",
  "tagger2.workflow.stages.token_budget",
  "backend.tagger2.workflow.caption_format.normalizer",
  "backend.tagger2.workflow.stages.policy",
  "backend.tagger2.workflow.stages.replacement",
  "backend.tagger2.workflow.stages.token_budget",
]
disable_error_code = ["arg-type", "assignment", "attr-defined", "call-overload", "var-annotated"]
