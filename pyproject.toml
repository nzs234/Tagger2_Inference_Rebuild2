[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tagger2-inference-rebuild"
version = "2.0.0"
description = "Local and online image tagging workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "numpy>=1.24,<3",
  "huggingface_hub>=0.24,<2",
  "safetensors>=0.4,<1",
  "transformers>=4.47,<6",
  "keyring>=25,<26",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "onnxruntime-gpu>=1.18,<2",
  "timm>=1.0,<2",
]
cpu = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "onnxruntime>=1.18,<2",
  "timm>=1.0,<2",
]
adapters = ["peft>=0.13,<1", "lycoris-lora>=3,<4"]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["models", "data_cache", "frontend/node_modules"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(^|[\\/])(models|data_cache|frontend[\\/]node_modules)([\\/]|$)"
