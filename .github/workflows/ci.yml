name: validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      TAGGER2_UPSTREAM_SOURCE_ROOT: ${{ github.workspace }}/upstream
    steps:
      - uses: actions/checkout@v7
      # Best effort: only the byte-level port tests need this mirror. If it
      # fails, the step below unsets the root so those tests skip instead of
      # blocking the ordinary unit tests.
      - name: Checkout fixed workflow source
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: lse14/e621-standard-capotion-workflow
          ref: ccc9d07497be637fc097c5da009d791f017144c9
          path: upstream
      - name: Make the upstream checkout optional for unit tests
        run: |
          if [ ! -e upstream/.git ]; then
            echo "TAGGER2_UPSTREAM_SOURCE_ROOT=" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Backend tests and static analysis
        run: |
          python -m pytest backend/tests -q
          python -m ruff check backend scripts
          python -m mypy backend scripts
      # Boots the real Runtime (fresh SQLite + schema migrations + workflow
      # resource catalog) through the wiki CLI and runs the release-resource
      # packaging/audit CLIs — all fully offline.
      - name: Offline wiki CLI, migration and release resource smoke
        run: |
          python scripts/build_tag_wiki.py --status
          python scripts/snapshot_wiki_databases.py --help
          python scripts/check_wiki_summaries.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run build
      - name: Browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
