[server]
host = "127.0.0.1"
port = 20000
lan_access = false
access_token_env = "TAGGER2_ACCESS_TOKEN"
debug = false

[paths]
cache_dir = "data_cache"
data_dir = "data"
upload_dir = "data/uploads"
artifact_dir = "data/artifacts"
log_dir = "data/logs"
allowed_input_roots = []
allowed_output_roots = []

[limits]
max_upload_bytes = 20971520
max_pixels = 67108864
max_online_edge = 2048
max_batch_items = 100000
max_online_concurrency = 16

[runtime]
max_loaded_models = 2
gpu_concurrency = 1
# Set a concrete MiB limit to enable model LRU eviction by memory budget.
# model_memory_budget_mb = 16384
allow_unsafe_pickle = false

[tag_wiki]
# Local e621 wiki mirror. embed_model_repo is the Hugging Face repo of the
# cross-lingual embedding model downloaded on first build (~470 MB); point it
# at a mirror/local repo id if Hugging Face is unreachable.
embed_model_repo = "intfloat/multilingual-e5-small"
# Default post_count threshold for the "popular tags" translation scope.
min_post_count = 1000
# Finished-product mode: with frozen = true the /build and /translate
# endpoints are rejected (403) — the bundled wiki/vector databases are
# read-only for end users. The maintainer builds locally with false, then
# ships the databases with true.
frozen = false
# Embedding backend used for building vectors and embedding queries.
#  - "local": ONNX/PyTorch weights under data/tag_wiki/models/<repo>
#  - "openai": OpenAI-compatible /v1/embeddings server (e.g. LM Studio's
#    local server) at embed_endpoint — handy for rebuilding with a stronger
#    model (bge-m3, Qwen3-Embedding) on the maintainer's machine.
# NOTE: rebuild and query must use the SAME model. If vectors are rebuilt
# through a remote server, export that model to ONNX under
# data/tag_wiki/models/<repo> (matching embed_model_repo) so end users
# embed queries with the same model offline.
#embed_backend = "local"
#embed_endpoint = "http://127.0.0.1:1234/v1"
#embed_model = ""          # empty = use the first model served by the endpoint
#embed_api_key = ""        # only needed by non-LM Studio providers
# Prefix overrides ("passage: "/"query: " for e5, "search_document: "/
# "search_query: " for nomic, none for bge/qwen/gte). Absent = auto-detect
# from the model name; set to "" to force no prefix.
#embed_passage_prefix = ""
#embed_query_prefix = ""
